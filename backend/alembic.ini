# Alembic configuration for Human Legacy AI

[alembic]
# Path to migration scripts
script_location = alembic
# Use the sync database URL (Alembic requires sync driver)
sqlalchemy.url = postgresql+psycopg2://humanlegacy:humanlegacy_dev_pass@localhost:5432/humanlegacy_db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

